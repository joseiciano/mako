          # --keep-vars retains Terraform-provisioned vars (e.g. AI_GATEWAY_BASE_URL) that are not declared in wrangler.jsonc.
          # Runtime secrets are synced by the dedicated step below: the action
          # overwrites process.env.CLOUDFLARE_API_TOKEN with the deploy token,
          # so the runtime token cannot be uploaded through `secrets:`.

      - name: Sync backend-rest runtime secrets
