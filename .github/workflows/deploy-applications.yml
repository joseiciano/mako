    name: Deploy backend-rest worker
    needs:
      - migrate-production-db
      - deploy-notification-orchestrator
    if: always() && needs.migrate-production-db.result == 'success' && needs.deploy-notification-orchestrator.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    concurrency:
