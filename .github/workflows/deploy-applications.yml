name: Deploy Applications

on:
  push:
    branches:
      - main
    paths:
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/deploy-applications.yml
  workflow_dispatch:

jobs:
  deploy-backend-rest:
    name: Deploy backend-rest worker
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    concurrency:
      group: deploy-backend-rest-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HYPERDRIVE_ID: ${{ secrets.HYPERDRIVE_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_TRUSTED_ORIGINS: ${{ secrets.BETTER_AUTH_TRUSTED_ORIGINS }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$HYPERDRIVE_ID" || (echo "Missing HYPERDRIVE_ID" && exit 1)
          test -n "$BETTER_AUTH_SECRET" || (echo "Missing BETTER_AUTH_SECRET" && exit 1)
          test -n "$BETTER_AUTH_URL" || (echo "Missing BETTER_AUTH_URL" && exit 1)
          test -n "$BETTER_AUTH_TRUSTED_ORIGINS" || (echo "Missing BETTER_AUTH_TRUSTED_ORIGINS" && exit 1)
          test -n "$STRIPE_SECRET_KEY" || (echo "Missing STRIPE_SECRET_KEY" && exit 1)

      - name: Inject Hyperdrive binding ID into Wrangler config
        working-directory: apps/backend-rest
        env:
          HYPERDRIVE_ID: ${{ secrets.HYPERDRIVE_ID }}
        run: |
          node -e "const fs=require('node:fs'); const filePath='wrangler.jsonc'; const placeholder='__HYPERDRIVE_ID__'; const hyperdriveId=process.env.HYPERDRIVE_ID; if (!hyperdriveId) throw new Error('Missing HYPERDRIVE_ID'); const current=fs.readFileSync(filePath, 'utf8'); if (!current.includes(placeholder)) throw new Error('Hyperdrive placeholder not found in wrangler.jsonc'); fs.writeFileSync(filePath, current.replaceAll(placeholder, hyperdriveId));"

      - name: Deploy backend-rest via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/backend-rest
          command: deploy --config wrangler.jsonc
          secrets: |
            BETTER_AUTH_SECRET
            BETTER_AUTH_URL
            BETTER_AUTH_TRUSTED_ORIGINS
            STRIPE_SECRET_KEY
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_TRUSTED_ORIGINS: ${{ secrets.BETTER_AUTH_TRUSTED_ORIGINS }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

  deploy-frontend:
    name: Deploy frontend worker
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    concurrency:
      group: deploy-frontend-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_AUTH_BASE_URL: ${{ secrets.VITE_AUTH_BASE_URL }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$VITE_AUTH_BASE_URL" || (echo "Missing VITE_AUTH_BASE_URL" && exit 1)

      - name: Build frontend application
        working-directory: apps/frontend
        env:
          VITE_AUTH_BASE_URL: ${{ secrets.VITE_AUTH_BASE_URL }}
        run: pnpm run build

      - name: Deploy frontend via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/frontend
          command: deploy
