        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_RUNTIME_API_TOKEN: ${{ secrets.CLOUDFLARE_RUNTIME_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_TRUSTED_ORIGINS: ${{ secrets.BETTER_AUTH_TRUSTED_ORIGINS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_REALTIMEKIT_APP_ID: ${{ secrets.CLOUDFLARE_REALTIMEKIT_APP_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          # Worker secret names stay CLOUDFLARE_API_TOKEN (code bindings read
          # that name) but the value is the dedicated runtime token.
          printf '%s' "$CLOUDFLARE_RUNTIME_API_TOKEN" | pnpm exec wrangler secret put CLOUDFLARE_API_TOKEN --config wrangler.jsonc
          printf '%s' "$BETTER_AUTH_SECRET" | pnpm exec wrangler secret put BETTER_AUTH_SECRET --config wrangler.jsonc
          printf '%s' "$BETTER_AUTH_URL" | pnpm exec wrangler secret put BETTER_AUTH_URL --config wrangler.jsonc
          printf '%s' "$BETTER_AUTH_TRUSTED_ORIGINS" | pnpm exec wrangler secret put BETTER_AUTH_TRUSTED_ORIGINS --config wrangler.jsonc
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | pnpm exec wrangler secret put CLOUDFLARE_ACCOUNT_ID --config wrangler.jsonc
          printf '%s' "$CLOUDFLARE_REALTIMEKIT_APP_ID" | pnpm exec wrangler secret put CLOUDFLARE_REALTIMEKIT_APP_ID --config wrangler.jsonc
          printf '%s' "$STRIPE_SECRET_KEY" | pnpm exec wrangler secret put STRIPE_SECRET_KEY --config wrangler.jsonc

  deploy-notification-orchestrator:
    name: Deploy notification-orchestrator worker
    needs: migrate-production-db
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    concurrency:
      group: deploy-notification-orchestrator-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

