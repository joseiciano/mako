name: Deploy Infrastructure

on:
  push:
    branches:
      - main
      - staging
    paths:
      - infrastructure/**
      - .github/workflows/deploy-infrastructure.yml
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply Terraform against"
        type: choice
        options:
          - staging
          - production
        default: staging
        required: true

# Each job applies exactly one environment's stack. The Terraform `environment`
# variable is passed per job as TF_VAR_environment; the S3/R2 backend and all
# provider credentials come from the matching GitHub environment's secrets.
jobs:
  terraform-apply-staging:
    name: Terraform Apply (staging)
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging' || github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read

    concurrency:
      group: deploy-infrastructure-staging
      cancel-in-progress: false

    defaults:
      run:
        working-directory: infrastructure

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # Drives the stack's required `environment` variable (staging|production);
      # without it `terraform apply` fails validation.
      TF_VAR_environment: staging
      # The one CI/infra token: used by the Terraform provider (and by Wrangler
      # in the applications workflow). Never synced into a Worker.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Validate required deployment secrets
        env:
          TF_STATE_R2_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          TF_STATE_R2_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$TF_STATE_R2_ACCESS_KEY_ID" || (echo "Missing TF_STATE_R2_ACCESS_KEY_ID" && exit 1)
          test -n "$TF_STATE_R2_SECRET_ACCESS_KEY" || (echo "Missing TF_STATE_R2_SECRET_ACCESS_KEY" && exit 1)

      - name: Render R2 backend endpoint for staging
        run: |
          # Backend configuration cannot reference Terraform variables; render
          # the non-secret S3 endpoint from this environment's account ID.
          sed "s|<cloudflare-account-id>|${CLOUDFLARE_ACCOUNT_ID}|" backend-r2.hcl.example > backend.ci.hcl

      - name: Terraform init (staging state bucket)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: terraform init -reconfigure -backend-config=backend.ci.hcl -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform apply (staging)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: terraform apply -auto-approve -input=false

  terraform-apply-production:
    name: Terraform Apply (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    concurrency:
      group: deploy-infrastructure-production
      cancel-in-progress: false

    defaults:
      run:
        working-directory: infrastructure

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: production
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Validate required deployment secrets
        env:
          TF_STATE_R2_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          TF_STATE_R2_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$TF_STATE_R2_ACCESS_KEY_ID" || (echo "Missing TF_STATE_R2_ACCESS_KEY_ID" && exit 1)
          test -n "$TF_STATE_R2_SECRET_ACCESS_KEY" || (echo "Missing TF_STATE_R2_SECRET_ACCESS_KEY" && exit 1)

      - name: Render R2 backend endpoint for production
        run: |
          sed "s|<cloudflare-account-id>|${CLOUDFLARE_ACCOUNT_ID}|" backend-r2.hcl.example > backend.ci.hcl

      - name: Terraform init (production state bucket)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: terraform init -reconfigure -backend-config=backend.ci.hcl -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform apply (production)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: terraform apply -auto-approve -input=false
