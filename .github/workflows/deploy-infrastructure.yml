name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - infrastructure/**
      - .github/workflows/deploy-infrastructure.yml
  workflow_dispatch:

concurrency:
  group: deploy-infrastructure-production
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Terraform Apply (production)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    defaults:
      run:
        working-directory: infrastructure

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Validate required deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Detect terraform files
        id: terraform-files
        run: |
          if ls *.tf >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform init
        if: steps.terraform-files.outputs.found == 'true'
        run: terraform init -input=false

      - name: Terraform validate
        if: steps.terraform-files.outputs.found == 'true'
        run: terraform validate

      - name: Terraform apply
        if: steps.terraform-files.outputs.found == 'true'
        run: terraform apply -auto-approve -input=false

      - name: Skip apply when no terraform files exist
        if: steps.terraform-files.outputs.found == 'false'
        run: echo "No *.tf files found in infrastructure/. Skipping terraform apply."
