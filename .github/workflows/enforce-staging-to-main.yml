name: Enforce Staging To Main

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  source-branch:
    name: source-branch-is-staging
    runs-on: ubuntu-latest
    steps:
      - name: Require staging as source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "staging" ]; then
            echo "PRs to main must come from staging (got: $HEAD_REF)."
            exit 1
          fi
