name: mako-local

x-node-modules-volumes: &node-modules-volumes
  - .:/app
  - mako-local-node-modules-root:/app/node_modules
  - mako-local-node-modules-backend-rest:/app/apps/backend-rest/node_modules
  - mako-local-node-modules-frontend:/app/apps/frontend/node_modules
  - mako-local-node-modules-greedy-matcher:/app/apps/greedy-matcher/node_modules
  - mako-local-node-modules-notification-orchestrator:/app/apps/notification-orchestrator/node_modules
  - mako-local-node-modules-shared:/app/packages/shared/node_modules
  - mako-local-node-modules-shared-backend:/app/packages/shared-backend/node_modules
  - mako-local-node-modules-shared-frontend:/app/packages/shared-frontend/node_modules

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mako_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:${LOCAL_POSTGRES_PORT:?set by scripts/local-stack}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d mako_local']
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - mako-local-postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: docker/local/Dockerfile
    image: mako-local-base
    working_dir: /app
    command:
      - sh
      - -c
      - pnpm db:migrate && pnpm --filter @mako/shared-backend exec node ../../docker/local/local-schema-patch.mjs
    environment:
      DATABASE_URL: ${LOCAL_DATABASE_URL:?set by scripts/local-stack}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    volumes: *node-modules-volumes

  workers:
    image: mako-local-base
    working_dir: /app
    command: ['sh', 'docker/local/workers-entrypoint.sh']
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      CLOUDFLARE_INCLUDE_PROCESS_ENV: 'true'
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${LOCAL_DATABASE_URL:?set by scripts/local-stack}
      WRANGLER_SEND_METRICS: 'false'
      BETTER_AUTH_SECRET: local-dev-only-secret-change-me-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
      CLOUDFLARE_ACCOUNT_ID: local-placeholder
      CLOUDFLARE_API_TOKEN: local-placeholder
      CLOUDFLARE_REALTIMEKIT_APP_ID: local-placeholder
      CLOUDFLARE_API_BASE_URL: ${LOCAL_CLOUDFLARE_API_BASE_URL:-}
      LOCAL_FAKES_ENABLED: ${LOCAL_FAKES_ENABLED:-}
      STRIPE_API_BASE_URL: ${LOCAL_STRIPE_API_BASE_URL:-}
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
    ports:
      - '127.0.0.1:${LOCAL_WORKERS_PORT:?set by scripts/local-stack}:8787'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 60
    volumes:
      - .:/app
      - mako-local-node-modules-root:/app/node_modules
      - mako-local-node-modules-backend-rest:/app/apps/backend-rest/node_modules
      - mako-local-node-modules-frontend:/app/apps/frontend/node_modules
      - mako-local-node-modules-greedy-matcher:/app/apps/greedy-matcher/node_modules
      - mako-local-node-modules-notification-orchestrator:/app/apps/notification-orchestrator/node_modules
      - mako-local-node-modules-shared:/app/packages/shared/node_modules
      - mako-local-node-modules-shared-backend:/app/packages/shared-backend/node_modules
      - mako-local-node-modules-shared-frontend:/app/packages/shared-frontend/node_modules
      - mako-local-workers-state:/state

  fakes:
    image: mako-local-base
    profiles: [fakes]
    working_dir: /app
    command: ['node', 'apps/fakes/src/index.ts']
    environment:
      FAKES_PORT: ${LOCAL_FAKES_PORT:?set by scripts/local-stack}
      FAKES_BACKEND_URL: http://workers:8787
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
    ports:
      - '127.0.0.1:${LOCAL_FAKES_PORT:?set by scripts/local-stack}:${LOCAL_FAKES_PORT:?set by scripts/local-stack}'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.FAKES_PORT + '/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - .:/app

  stripe-mock:
    image: stripe/stripe-mock:v0.206.0
    profiles: [fakes]
    command: ['-http-port', '12111']

  seed:
    image: mako-local-base
    working_dir: /app/packages/shared-backend
    command: ['node', '../../scripts/local-stack/seed.mjs']
    environment:
      DATABASE_URL: ${LOCAL_DATABASE_URL:?set by scripts/local-stack}
      SEED_WORKERS_URL: http://workers:8787
    depends_on:
      workers:
        condition: service_healthy
    restart: 'no'
    volumes: *node-modules-volumes

  frontend:
    image: mako-local-base
    working_dir: /app
    command: ['sh', 'docker/local/frontend-entrypoint.sh']
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      MAKO_BACKEND_API_ORIGIN: http://workers:8787
      VITE_AUTH_BASE_URL: http://localhost:3000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      workers:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 60
    volumes: *node-modules-volumes

volumes:
  mako-local-workers-state:
  mako-local-postgres-data:
  mako-local-node-modules-root:
  mako-local-node-modules-backend-rest:
  mako-local-node-modules-frontend:
  mako-local-node-modules-greedy-matcher:
  mako-local-node-modules-notification-orchestrator:
  mako-local-node-modules-shared:
  mako-local-node-modules-shared-backend:
  mako-local-node-modules-shared-frontend:
