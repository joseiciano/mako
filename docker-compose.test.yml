services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mako_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mako_test']
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - mako-postgres-test-data:/var/lib/postgresql/data

volumes:
  mako-postgres-test-data:
